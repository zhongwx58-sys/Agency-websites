name: Deploy tutorial to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Build the complete tutorial
        working-directory: site
        env:
          SITE_BASE: /Agency-websites/
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the existing branch-based Pages deployment
        uses: actions/github-script@v8
        with:
          script: |
            for (let attempt = 0; attempt < 36; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                head_sha: context.sha,
                per_page: 30,
              });
              const pending = data.workflow_runs.some(run =>
                run.event === 'dynamic' &&
                run.name === 'pages build and deployment' &&
                run.status !== 'completed'
              );
              if (!pending) return;
              core.info('Waiting for the previous Pages publishing flow to finish.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('The previous Pages publishing flow did not finish in time.');
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
